version: 2

models:
  - name: open_status_time_delta
    description: "{{ doc('open_status_time_delta') }}"
    config:
      matieralized: table
    columns:
      - name: month_transitioned_at
        description: "{{ doc('month_transitioned_at') }}"
      - name: avg_time_open_days
        description: "{{ doc('avg_time_open_days')}}"


