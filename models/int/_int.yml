version: 2

models:
  - name: int_transactions
    description: "{{ doc('int_transactions') }}"
    config:
      matieralized: view
    columns:
      - name: id
        description: "{{ doc('transaction_id') }}"
      - name: bid_id
        description: "{{ doc('bid_id') }}"
      - name: state
        description: "{{ doc('state') }}"
      - name: transfer_method
        description: "{{ doc('transfer_method') }}"
      - name: inserted_at
        description: "{{ doc('inserted_at') }}"
      - name: company_id
        description: "{{ doc('company_id') }}"
      - name: num_shares
        description: "{{ doc('num_shares') }}"
      - name: price_per_share
        description: "{{ doc('price_per_share') }}"
      - name: gross_proceeds
        description: "{{ doc('gross_proceeds') }}"
      - name: _fivetran_deleted
        description: "{{ doc('_fivetran_deleted') }}"
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"
      - name: is_open_transaction
        description: "{{ doc('is_open_transaction') }}"
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [TRUE,FALSE]
      - name: termination_reason
        description: "{{ doc('termination_reason') }}"

  - name: int_transaction_transitions
    description: "{{ doc('transaction_transitions') }}"
    config:
      matieralized: view
    columns:
      - name: id
        description: "{{ doc('transaction_transition_id') }}"
      - name: inserted_at
        description: "{{ doc('inserted_at') }}"
      - name: updated_at
        description: "{{ doc('updated_at') }}"
      - name: transaction_id
        description: "{{ doc('transaction_id') }}"
      - name: new_state
        description: "{{ doc('new_state') }}"
      - name: transitioned_at
        description: "{{ doc('transitioned_at') }}"
      - name: _fivetran_deleted
        description: "{{ doc('_fivetran_deleted') }}"
      - name: _fivetran_synced
        description: "{{ doc('_fivetran_synced') }}"
      - name: is_open_transaction
        description: "{{ doc('is_open_transaction') }}"
      - name: old_state
        description: "{{ doc('old_state') }}"
      - name: old_state_transitioned_at
        description: "{{ doc('old_state_transitioned_at') }}"  
      - name: transition_type
        description: "{{ doc('transition_type') }}"
      - name: time_delta_days
        description: "{{ doc('time_delta_days')}}"
      - name: time_delta_hours
        description: "{{ doc('time_delta_hours')}}"